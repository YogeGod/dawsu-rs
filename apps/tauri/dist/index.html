<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>dawsu!</title><link rel="icon" href="studio-assets/dawsu.png"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ui/ui.css"><script defer src="docking.js"></script><script defer src="ui/ui.js"></script><script defer src="menus.js"></script></head>
<body>
<header id="editor-header" class="chrome">
  <strong class="brand"><span class="brand-diamond" aria-hidden="true"></span>dawsu!</strong>
  <span class="header-divider" aria-hidden="true"></span>
<nav id="editor-menus" aria-label="Editor menus">
  <button id="menu-file" aria-haspopup="menu" aria-expanded="false" aria-controls="editor-menu">File</button>
  <button id="menu-edit" aria-haspopup="menu" aria-expanded="false" aria-controls="editor-menu">Edit</button>
  <button id="menu-playback" aria-haspopup="menu" aria-expanded="false" aria-controls="editor-menu">Playback</button>
  <button id="menu-map" aria-haspopup="menu" aria-expanded="false" aria-controls="editor-menu">Map</button>
  <button id="menu-view" aria-haspopup="menu" aria-expanded="false" aria-controls="editor-menu">View</button>
</nav>
  <div class="map-chip" role="group" aria-label="Map">
    <span id="map-title" class="map-chip-title"></span>
    <span id="map-version" class="map-chip-version"></span>
    <span id="map-hs-badge" class="hs-badge" hidden>HS</span>
    <svg class="map-chip-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    <select id="difficulty" aria-label="Difficulty" data-doc></select>
  </div>
  <div id="top-transport" class="top-transport" role="group" aria-label="Playback controls">
    <div data-ui-mount="transport"></div>
  </div>
  <span class="spacer"></span>
  <button id="export-entry" type="button" aria-label="Export…" title="Export…" data-doc><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 21.7a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7zM12 22V12M3.3 7 12 12l8.7-5M7.5 4.3l9 5.1"/></svg><span class="header-label">Export…</span></button>
  <span class="header-divider" aria-hidden="true"></span>
  <button id="save" data-doc data-dirty="false"><img class="button-icon" src="studio-assets/icons/Save.svg" alt=""><span class="header-label">Save</span><span id="save-problem-badge" hidden></span></button>
  <span class="header-divider" aria-hidden="true"></span>
  <div class="panel-switches" role="group" aria-label="Panels">
    <button id="view-browser" type="button" data-doc aria-label="Browser" aria-controls="tree-browser-host" aria-pressed="false" title="Browser"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
    <button id="view-inspector" type="button" data-doc aria-label="Inspector" aria-controls="editor-inspector" aria-pressed="false" title="Inspector"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg></button>
    <button id="view-controller" type="button" data-doc aria-label="Volume and Mixer" aria-controls="volume-controller-panel" aria-pressed="false" title="Volume and Mixer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></svg></button>
  </div>
</header>
<button id="layout-edit-entry" type="button" data-doc hidden>Layout…</button>

<div id="editor-menu" role="menu" data-ui-mount="menu" hidden></div>
<div popover id="options-Lanes" class="ribbon-controls ribbon-options" role="group" aria-label="Lanes" data-ui-mount="lane-options"></div>
<section id="home" data-ui-mount="start-screen"></section>
<section id="workspace" hidden>
  <section id="layout-editor" class="chrome" aria-label="Edit layout" data-dock-control hidden>
    <strong>Edit layout</strong>
    <span>Drag the grip on a whole bar to move it. Drag its edge to resize.</span>
    <label>Ribbon group <select id="layout-ribbon-group"></select></label>
    <button id="layout-left" type="button" aria-label="Move ribbon group left">Move left</button>
    <button id="layout-right" type="button" aria-label="Move ribbon group right">Move right</button>
    <span class="spacer"></span>
    <button id="layout-reset" type="button">Reset</button>
    <button id="layout-cancel" type="button">Cancel</button>
    <button id="layout-keep" type="button" class="primary">Keep layout</button>
    <div class="layout-button-controls" role="group" aria-label="Customize bars and sidebars">
      <label>Bar or sidebar <select id="layout-bar"></select></label>
      <button id="layout-bar-earlier" type="button">Move up</button>
      <button id="layout-bar-later" type="button">Move down</button>
      <label><input id="layout-bar-hidden" type="checkbox"> Hide bar or sidebar</label>
    </div>
    <div class="layout-button-controls" role="group" aria-label="Customize buttons">
      <label>Button <select id="layout-button"></select></label>
      <label>Location <select id="layout-button-location">
        <option value="original">Original group</option><option value="header">Header</option>
        <option value="ribbon">Ribbon</option><option value="ruler">Ruler</option>
        <option value="inspector">Inspector</option>
        <option value="browser">Browser</option><option value="status">Status bar</option>
      </select></label>
      <button id="layout-button-before" type="button">Earlier</button>
      <button id="layout-button-after" type="button">Later</button>
      <label><input id="layout-button-hidden" type="checkbox"> Hide</label>
      <label>Width <input id="layout-button-width" type="number" placeholder="Auto" min="16" max="320" aria-label="Button width in pixels"></label>
      <label>Height <input id="layout-button-height" type="number" placeholder="Auto" min="16" max="100" aria-label="Button height in pixels"></label>
    </div>
  </section>

  <div id="editor-ribbon" class="tools chrome">
  <div class="ribbon-group" role="group" aria-label="Lane mode">
    <div class="row lane-mode" role="group" aria-label="Lane view">
      <button id="samples-view" type="button" aria-pressed="true" aria-label="Hitsounds" data-doc><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"/></svg><span class="lane-mode-label">Hitsounds</span></button>
      <button id="drums-view" type="button" aria-pressed="false" aria-label="Drums" data-doc><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 2 8 8M22 2l-8 8"/><ellipse cx="12" cy="9" rx="10" ry="5"/><path d="M7 13.4v7.9M12 14v8M17 13.4v7.9M2 9v8a10 5 0 0 0 20 0V9"/></svg><span class="lane-mode-label">Drums</span></button>
      <button id="keysounds-view" type="button" aria-pressed="false" aria-label="Keysounds" title="Melodic Keysounding (Piano Roll)" data-doc><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v10M11 4v10M15 4v10M19 4v10"/></svg><span class="lane-mode-label">Keysounds</span></button>
      <button id="drums-vst3-toggle" type="button" aria-pressed="false" aria-label="Drum VST3" title="Play mapped drum lanes through a VST3 instrument" data-doc hidden><span class="lane-mode-label">VST3</span></button>
      <button id="drums-vst3-menu" type="button" aria-label="Drums VST settings" title="Drums VST3 instrument, editor, state & render…" data-doc hidden>▾</button>
    </div>
  </div>
    <div class="ribbon-group" role="group" aria-label="Tool">
      <span class="ribbon-caption" aria-hidden="true">Tool</span>
      <div data-ui-mount="tools"></div>
    </div>
    <div class="ribbon-group" role="group" aria-label="Audition">
      <div data-ui-mount="audition"></div>
    </div>
    <div class="ribbon-group" role="group" aria-label="Playhead">
      <div data-ui-mount="playhead"></div>
    </div>
    <div class="ribbon-group" role="group" aria-label="Grid">
      <div class="ribbon-controls"><div data-ui-mount="snap"></div>
      <button id="grid-options" type="button" popovertarget="options-Grid" aria-label="More snaps" title="More snaps">▾</button><div popover id="options-Grid" class="ribbon-controls ribbon-options" data-ui-mount="grid-options"></div></div>
    </div>
  </div>
  <div id="base-diff-strip" data-ui-mount="base-diff-strip"></div>
  <main id="editor-dock" class="dock">
    <aside id="tree-browser-host" aria-label="Browser" data-hint-zone="browser" hidden>
      <div class="panel-head"><h2>Browser</h2><button id="browser-fold" type="button" data-doc class="panel-fold" aria-label="Fold Browser" title="Fold Browser" aria-controls="tree-browser-host"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M16 15l-3-3 3-3"/></svg></button></div>
      <nav class="panel-rail" aria-label="Browser" hidden>
        <button id="browser-unfold" type="button" data-doc aria-label="Open Browser" title="Open Browser" aria-controls="tree-browser-host"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M14 9l3 3-3 3"/></svg></button>
        <button id="rail-browser-browse" type="button" data-doc aria-label="Mapset samples" title="Mapset samples"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></svg></button>
        <button id="rail-browser-search" type="button" data-doc aria-label="Search samples" title="Search samples"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
        <button id="rail-browser-library" type="button" data-doc aria-label="Library" title="Library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></svg></button>
      </nav>
      <section id="sample-browser">
        <div class="sample-browser-classic-head"><h2>Samples</h2><button type="button" id="sample-browser-close" aria-label="Close Browser">Close</button></div>
        <div data-ui-mount="browser-head"></div>
        <div id="sample-browser-entries" data-ui-mount="browser-list" aria-label="Samples and folders"></div>
        <div data-ui-mount="browser-preview"></div>
      </section>
    </aside>
    <div id="editor-arrange" class="arrange">
      <div class="ruler">
        <div class="ruler-sidebar">
          <div class="lane-title lane-title-controls" role="toolbar" aria-label="Timeline view">
            <button id="ruler-zoom-out" type="button" class="lane-tool" aria-label="Zoom out" title="Zoom out" data-doc><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M8 11h6"/></svg></button>
            <button id="ruler-zoom-in" type="button" class="lane-tool" aria-label="Zoom in" title="Zoom in" data-doc><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M11 8v6m-3-3h6"/></svg></button>
            <button id="ruler-fit" type="button" class="lane-tool lane-tool-label" aria-label="Fit all" title="Fit the whole song" data-doc><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 8 4 4-4 4M2 12h20M6 8l-4 4 4 4"/></svg><span>Fit all</span></button>
            <span class="lane-tool-divider" aria-hidden="true"></span>
            <span class="lane-tool-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2v20M8 18l4 4 4-4M8 6l4-4 4 4"/></svg></span>
            <button id="lane-shorter" type="button" class="lane-tool" aria-label="Shorter lanes" title="Shorter lanes" data-doc><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 20 5-5 5 5M7 4l5 5 5-5"/></svg></button>
            <button id="lane-taller" type="button" class="lane-tool" aria-label="Taller lanes" title="Taller lanes" data-doc><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg></button>
          </div>
          <div class="lane-title song-row">
            <span class="song-strip" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3"/></svg></span>
            <div class="song-body">
              <span class="song-title">Song · objects</span>
              <div class="row">
                <button id="song-mute" type="button" aria-label="Mute song" aria-pressed="false" title="Mute song" data-doc>M</button>
                <button id="song-solo" type="button" aria-label="Solo song" aria-pressed="false" title="Solo song" data-doc>S</button>
                <button id="ruler-waveform" type="button" aria-label="Show waveform" aria-pressed="true" title="Show waveform" data-doc><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"/></svg></button>
                <button id="ruler-sound-first" type="button" aria-label="Sound-first: hide missing-object warnings" aria-pressed="false" title="Sound-first: hide missing-object warnings" data-doc><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
                <button id="song-stem" type="button" class="stem-pill" aria-label="Attach drum stem" aria-pressed="false" title="Attach drum stem (T to toggle Song / Stem)" data-doc>+ Stem</button>
              </div>
            </div>
          </div>
        </div>
        <canvas id="ruler" aria-label="Time ruler, song waveform and gameplay objects" data-hint-zone="ruler"></canvas>
        <div id="waveform-resize" role="separator" tabindex="0" aria-orientation="horizontal"
             aria-label="Waveform height" aria-valuemin="0" aria-valuemax="200" aria-valuenow="84"
             title="Drag to resize waveform. Double-click to reset."></div>
      </div>
      <div class="scroll" id="scroll"><div id="lanes" data-ui-mount="lanes" data-hint-zone="lanes"></div><canvas id="grid" tabindex="-1" aria-label="Hitsound timeline" aria-haspopup="menu" aria-expanded="false" data-hint-zone="timeline"></canvas></div>
      <div id="volume-controller-panel" class="controller">
        <div class="lane-title volume-title">
          <div data-ui-mount="bottom-panel"></div>
          <select id="ramp-shape" aria-label="Ramp shape" title="Shape for the Ramp tool and Shift+drag" data-doc>
            <option value="Linear">Linear</option>
            <option value="EaseIn">Ease in</option>
            <option value="EaseOut">Ease out</option>
            <option value="SCurve">S-curve</option>
          </select>
        </div>
        <canvas id="controller" aria-label="Hit volume lane" data-hint-zone="volume"></canvas>
        <div class="mixer-host" data-ui-mount="mixer"></div>
      </div>
      <div class="overview">
        <div class="lane-title ruler-controls" data-ui-mount="overview-diagnostics"><span>Objects overview</span></div>
        <canvas id="overview" aria-label="Song overview" data-hint-zone="overview"></canvas>
      </div>

    </div>
    <aside id="editor-inspector" aria-label="Inspector" data-hint-zone="inspector">
      <div class="panel-head"><h2>Inspector</h2><button id="inspector-fold" type="button" data-doc class="panel-fold" aria-label="Fold Inspector" title="Fold Inspector" aria-controls="editor-inspector"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18M8 9l3 3-3 3"/></svg></button></div>
      <nav class="panel-rail" aria-label="Inspector" hidden>
        <button id="inspector-unfold" type="button" data-doc aria-label="Open Inspector" title="Open Inspector" aria-controls="editor-inspector"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18M10 15l-3-3 3-3"/></svg></button>
        <button id="rail-inspector-selection" type="button" data-doc aria-label="Selection" title="Selection"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.04 4.66a.5.5 0 0 1 .62-.62l15.5 5.3a.5.5 0 0 1-.07.97l-6.13 1.5a2 2 0 0 0-1.46 1.46l-1.5 6.13a.5.5 0 0 1-.97.07z"/></svg></button>
        <button id="rail-inspector-lane" type="button" data-doc aria-label="Lane" title="Lane"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18"/></svg></button>
        <button id="rail-inspector-difficulty" type="button" data-doc aria-label="Difficulty" title="Difficulty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12.8 2.2 8.6 3.9a1 1 0 0 1 0 1.8l-8.6 3.9a2 2 0 0 1-1.6 0L2.6 7.9a1 1 0 0 1 0-1.8l8.6-3.9a2 2 0 0 1 1.6 0zM2 12a1 1 0 0 0 .6.9l8.6 3.9a2 2 0 0 0 1.6 0l8.6-3.9A1 1 0 0 0 22 12M2 17a1 1 0 0 0 .6.9l8.6 3.9a2 2 0 0 0 1.6 0l8.6-3.9A1 1 0 0 0 22 17"/></svg></button>
        <button id="rail-inspector-bookmarks" type="button" data-doc aria-label="Bookmarks" title="Bookmarks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
      </nav>
      <section class="inspector-part" aria-label="Map preview"><div data-ui-mount="map-preview"></div></section>
      <section class="inspector-part" aria-label="Selection"><div data-ui-mount="inspector-selection"></div></section>
      <section class="inspector-part" aria-label="Lane"><div data-ui-mount="inspector-lane"></div></section>
      <section class="inspector-part" aria-label="Difficulty"><div data-ui-mount="inspector-difficulty"></div></section>
      <section class="inspector-part" aria-label="Bookmarks"><div data-ui-mount="inspector-bookmarks"></div></section>
      <div id="classic-browser-host" hidden></div>
      <section class="inspector-part" aria-label="History"><div data-ui-mount="inspector-history"></div></section>
    </aside>
  </main>
</section>
<div id="statusbar" data-ui-mount="status-bar"><span id="status" role="status"></span></div>
<div data-ui-mount="hit-card"></div>
<div data-ui-mount="volume-bubble"></div>
<div data-ui-mount="micro-hud"></div>
<div data-ui-mount="preferences"></div>
<div data-ui-mount="export-modal"></div>
<div data-ui-mount="midi-import"></div>
<div data-ui-mount="keysounds"></div>
<div data-ui-mount="drum-studio"></div>
<div data-ui-mount="shared-base"></div>
<div data-ui-mount="stem-separation"></div>
<div data-ui-mount="toasts"></div>
<div data-ui-mount="quick-start"></div>
<div data-ui-mount="loading-overlay"></div>
<div data-ui-mount="command-palette"></div>
<dialog id="dialog"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="row" id="dialog-actions"></div></dialog>
</body></html>
