[package]
name = "dawsu-tauri"
version = "1.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
asio-local = ["dawsu-application/asio-local"]
recovery-smoke = []

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
tauri = { version = "=2.12.5", features = ["custom-protocol"] }
rfd = "=0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dawsu-application = { path = "../../crates/dawsu-application" }
dawsu-editor = { path = "../../crates/dawsu-editor" }
dawsu-foundation = { path = "../../crates/dawsu-foundation" }
dawsu-hitsounding = { path = "../../crates/dawsu-hitsounding" }
