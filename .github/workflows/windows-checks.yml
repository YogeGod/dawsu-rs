# Runs the repo's checks (AGENTS.md "Verification") on Windows for every pull request that
# changes more than .md files, whoever opens it, and on main after each merge. Windows only
# for now: Linux and macOS wait until Yoge approves the Windows version. The lazer oracle is
# not run here: it needs a local copy of lazer's source.
name: Windows checks

on:
  pull_request:
    paths-ignore:
      - "**.md"
  # Runs on main after a merge save the Rust cache that every new pull request starts from.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# A new push to the same pull request stops the run that is still going.
concurrency:
  group: windows-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Tests on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # signalsmith-stretch needs libclang; the Windows runner ships LLVM here.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      # Keep the repo's exact bytes (LF line endings, AGENTS.md) instead of Windows' CRLF.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tauri/ui/package-lock.json

      # First, while dist/ui/ still holds the committed bundle: ui-bundle.test.mjs checks it
      # matches the Svelte sources.
      - name: Frontend integration tests
        shell: bash
        run: node --test apps/tauri/tests/*.test.mjs

      - name: Install Svelte UI packages
        working-directory: apps/tauri/ui
        run: npm ci

      - name: Svelte UI build
        working-directory: apps/tauri/ui
        run: npm run build

      - name: Svelte UI unit tests
        working-directory: apps/tauri/ui
        run: npm test

      # The Rust steps run even when a step above failed, so one run reports everything.
      # Installs the version in rust-toolchain.toml.
      - name: Rust toolchain
        if: ${{ !cancelled() }}
        run: rustup toolchain install --profile minimal

      # Only main saves the cache: pull requests reuse it without filling the cache space.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !cancelled() }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy lints
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust workspace tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --no-fail-fast
