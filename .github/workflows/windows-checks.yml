# Runs the repo's checks (AGENTS.md "Verification") on Windows for every pull request,
# whoever opens it. Windows only for now: Linux and macOS wait until Yoge approves the
# Windows version. The lazer oracle is not run here: it needs a local copy of lazer's source.
name: Windows checks

on:
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# A new push to the same pull request stops the run that is still going.
concurrency:
  group: windows-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Tests on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # signalsmith-stretch needs libclang; the Windows runner ships LLVM here.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      # Keep the repo's exact bytes (LF line endings, AGENTS.md) instead of Windows' CRLF.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tauri/ui/package-lock.json

      # First, while dist/ui/ still holds the committed bundle: ui-bundle.test.mjs checks it
      # matches the Svelte sources.
      - name: Frontend integration tests
        shell: bash
        run: node --test apps/tauri/tests/*.test.mjs

      - name: Install Svelte UI packages
        working-directory: apps/tauri/ui
        run: npm ci

      - name: Svelte UI build
        working-directory: apps/tauri/ui
        run: npm run build

      - name: Svelte UI unit tests
        working-directory: apps/tauri/ui
        run: npm test

      # Installs the version in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Rust workspace tests
        run: cargo test --workspace --locked
