name: Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (defaults to Cargo.toml version)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-windows:
    name: Build & package Windows release
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      # signalsmith-stretch needs libclang; the Windows runner ships LLVM here.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # Pinned Steinberg VST 3 SDK release (MIT since 3.8). Matches E:\dawsu-source-cache\vst3sdk.
      VST3_SDK_TAG: v3.8.1_build_84
    steps:
      # Keep the repo's exact bytes (LF line endings) instead of Windows' CRLF.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      # Installs the version in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tauri/ui/package-lock.json

      - name: Cache VST 3 SDK
        id: vst3sdk-cache
        uses: actions/cache@v4
        with:
          path: vst3sdk
          key: vst3sdk-${{ env.VST3_SDK_TAG }}

      - name: Fetch VST 3 SDK
        if: steps.vst3sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake

      - name: Build VST 3 host sidecar
        shell: pwsh
        run: |
          cmake -S native/vst3-host -B native/vst3-host/build -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk"
          cmake --build native/vst3-host/build --config Release
          if (-not (Test-Path native/vst3-host/build/Release/dawsu_vst3_host.exe)) {
            throw "dawsu_vst3_host.exe was not produced"
          }

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build UI bundle
        working-directory: apps/tauri/ui
        run: |
          npm ci
          npm run build
          npm test

      - name: Run Tauri frontend tests
        run: node --test apps/tauri/tests/*.test.mjs

      - name: Build release binary
        run: cargo build --release -p dawsu-tauri --locked

      - name: Package installer, portable zip & SHA256SUMS.txt
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver -and "${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart('v', 'V')
          }
          if ($ver) {
            powershell -ExecutionPolicy Bypass -File tools/package-release.ps1 -Version $ver -SkipBuild -RequireVst3Host
          } else {
            powershell -ExecutionPolicy Bypass -File tools/package-release.ps1 -SkipBuild -RequireVst3Host
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dawsu-windows-release
          path: dist/release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/release/*-setup.exe
            dist/release/*-portable.zip
            dist/release/SHA256SUMS.txt
