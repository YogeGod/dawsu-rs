name: Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (defaults to Cargo.toml version)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-windows:
    name: Build & package Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build UI bundle
        working-directory: apps/tauri/ui
        run: |
          npm ci
          npm run build
          npm test

      - name: Run Tauri frontend tests
        run: node --test apps/tauri/tests/*.test.mjs

      - name: Build release binary
        run: cargo build --release -p dawsu-tauri --locked

      - name: Package installer, portable zip & SHA256SUMS.txt
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver -and "${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart('v', 'V')
          }
          if ($ver) {
            powershell -ExecutionPolicy Bypass -File tools/package-release.ps1 -Version $ver -SkipBuild
          } else {
            powershell -ExecutionPolicy Bypass -File tools/package-release.ps1 -SkipBuild
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dawsu-windows-release
          path: dist/release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/*-setup.exe
            dist/release/*-portable.zip
            dist/release/SHA256SUMS.txt
