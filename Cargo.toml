[workspace]
resolver = "3"
members = [
    "crates/dawsu-foundation",
    "crates/dawsu-editor",
    "crates/dawsu-osu-format",
    "crates/dawsu-hitsounding",
    "crates/dawsu-test-support",
    "crates/dawsu-editor-composer",
    "crates/dawsu-audio",
    "crates/dawsu-graph-audio",
    "crates/dawsu-application",
    "apps/tauri",
]
default-members = ["apps/tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
publish = false
