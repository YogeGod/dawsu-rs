[workspace]
resolver = "3"
members = [
    "crates/dawsu-foundation",
    "crates/dawsu-editor",
    "crates/dawsu-osu-format",
    "crates/dawsu-hitsounding",
    "crates/dawsu-test-support",
    "crates/dawsu-editor-composer",
    "crates/dawsu-audio",
    "crates/dawsu-application",
    "crates/dawsu-ui",
    "crates/dawsu-desktop",
]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
publish = false
