[workspace]
resolver = "3"
members = [
    "crates/dawsu-foundation",
    "crates/dawsu-editor",
    "crates/dawsu-osu-format",
    "crates/dawsu-hitsounding",
    "crates/dawsu-keysounding",
    "crates/dawsu-test-support",
    "crates/dawsu-editor-composer",
    "crates/dawsu-audio",
    "crates/dawsu-audio-instruments",
    "crates/dawsu-graph",
    "crates/dawsu-graph-audio",
    "crates/dawsu-editor-nodal",
    "crates/dawsu-application",
    "apps/tauri",
]
default-members = ["apps/tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
cpal = "=0.18.2"
midir = "0.11"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
signalsmith-stretch = "=0.1.3"
symphonia = { version = "=0.6.0", features = ["mp3"] }
vorbis_rs = { version = "0.5.6", default-features = false }
zip = { version = "=9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Debug builds stay debuggable, but dependencies (decode, JSON, FFT, stretch) run at full speed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
