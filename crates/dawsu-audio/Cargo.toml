[package]
name = "dawsu-audio"
version = "0.1.0"
edition.workspace = true

[features]
asio-local = ["cpal/asio", "dep:asio-sys"]

[dependencies]
dawsu-foundation = { path = "../dawsu-foundation" }
cpal = "=0.18.2"
symphonia = { version = "=0.6.0", features = ["mp3"] }
signalsmith-stretch = "=0.1.3"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
asio-sys = { version = "=0.4.0", optional = true }
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio_DirectSound",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
