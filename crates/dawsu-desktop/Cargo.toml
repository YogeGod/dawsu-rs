[package]
name = "dawsu-desktop"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "dawsu"
path = "src/main.rs"

[dependencies]
dawsu-application = { path = "../dawsu-application" }
dawsu-ui = { path = "../dawsu-ui" }
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = "=0.17.2"
