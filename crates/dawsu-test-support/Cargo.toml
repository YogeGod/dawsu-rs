[package]
name = "dawsu-test-support"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Test-only helpers shared by the dawsu crates' tests (ADR 0039). Never shipped."

[dependencies]
dawsu-foundation = { path = "../dawsu-foundation" }
# Test-only: reads the lazer oracle's JSON (ADR 0040). No shipped crate depends on it.
# float_roundtrip: exact float parsing; without it a value can come back one bit off.
serde_json = { workspace = true, features = ["float_roundtrip"] }
