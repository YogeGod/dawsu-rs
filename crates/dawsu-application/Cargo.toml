[package]
name = "dawsu-application"
version = "0.1.0"
edition.workspace = true

[features]
default = ["stem-separation"]
stem-separation = ["dep:ort", "dep:reqwest", "dep:sha2", "dep:zip"]
asio-local = ["dawsu-audio/asio-local"]

[dependencies]
dawsu-foundation = { path = "../dawsu-foundation" }
dawsu-osu-format = { path = "../dawsu-osu-format" }
dawsu-hitsounding = { path = "../dawsu-hitsounding" }
dawsu-editor = { path = "../dawsu-editor" }
dawsu-editor-composer = { path = "../dawsu-editor-composer" }
dawsu-audio = { path = "../dawsu-audio" }
dawsu-audio-instruments = { path = "../dawsu-audio-instruments" }
dawsu-keysounding = { path = "../dawsu-keysounding" }
dawsu-graph = { path = "../dawsu-graph" }
dawsu-graph-audio = { path = "../dawsu-graph-audio" }
dawsu-editor-nodal = { path = "../dawsu-editor-nodal" }
serde = { workspace = true }
serde_json = { workspace = true }
vorbis_rs = { workspace = true }
ort = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
dawsu-test-support = { path = "../dawsu-test-support" }
