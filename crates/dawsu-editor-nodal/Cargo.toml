[package]
name = "dawsu-editor-nodal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Graph editing operations and proposal application (Layer 5 · Editing).
# Must NEVER reference dawsu-graph-audio or dawsu-graph-stems (Rule R9).
[dependencies]
dawsu-foundation = { path = "../dawsu-foundation" }
dawsu-editor = { path = "../dawsu-editor" }
dawsu-graph = { path = "../dawsu-graph" }
dawsu-hitsounding = { path = "../dawsu-hitsounding" }
dawsu-editor-composer = { path = "../dawsu-editor-composer" }
serde_json = "1.0"

[dev-dependencies]
dawsu-osu-format = { path = "../dawsu-osu-format" }
